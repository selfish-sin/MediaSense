name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked backend dependencies
        shell: pwsh
        run: |
          python -m venv backend/venv
          backend/venv/Scripts/python.exe -m pip install -r backend/requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          backend/venv/Scripts/python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item backend/config.example.py backend/config.py
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify Python and frontend
        run: backend/venv/Scripts/python.exe verify.py all
